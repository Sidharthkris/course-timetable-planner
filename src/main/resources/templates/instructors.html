<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Instructors — Course Timetable Planner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Instructors</h1>

    <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>
    <p th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></p>

    <table class="data-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th sec:authorize="hasRole('COORDINATOR')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="instructor : ${instructors}">
            <td th:text="${instructor.fullName}"></td>
            <td th:text="${instructor.email}"></td>
            <td th:text="${instructor.department != null ? instructor.department.name : '—'}"></td>
            <td sec:authorize="hasRole('COORDINATOR')">
                <form th:action="@{/instructors/{id}/delete(id=${instructor.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Delete this instructor?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="link-button danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(instructors)}">
            <td colspan="4">No instructors yet.</td>
        </tr>
        </tbody>
    </table>

    <div sec:authorize="hasRole('COORDINATOR')" class="form-card">
        <h2>Add an instructor</h2>
        <form th:action="@{/instructors}" method="post" class="form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required="required"/>
            <label for="email">Email</label>
            <input type="email" id="email" name="email"/>
            <label for="departmentId">Department</label>
            <select id="departmentId" name="departmentId" required="required">
                <option th:each="department : ${departments}" th:value="${department.id}"
                        th:text="${department.name}"></option>
            </select>
            <button type="submit">Add instructor</button>
        </form>
    </div>
</main>
</body>
</html>
