<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login — Course Timetable Planner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="auth-body">
<div class="auth-card">
    <h1>Course Timetable Planner</h1>
    <p class="subtitle">Sign in to continue</p>

    <p th:if="${param.error}" class="alert alert-error">Invalid username or password.</p>
    <p th:if="${param.logout}" class="alert alert-info">You have been logged out.</p>

    <form th:action="@{/login}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus="autofocus" required="required"/>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required="required"/>

        <button type="submit">Sign in</button>
    </form>

    <div class="demo-creds">
        <p><strong>Demo accounts</strong></p>
        <p>Coordinator (full access): <code>coordinator</code> / <code>coordinator123</code></p>
        <p>Instructor (view only): <code>instructor</code> / <code>instructor123</code></p>
    </div>
</div>
</body>
</html>
