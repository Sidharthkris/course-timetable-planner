<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Courses — Course Timetable Planner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Courses</h1>

    <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>
    <p th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></p>

    <table class="data-table">
        <thead>
        <tr>
            <th>Code</th>
            <th>Title</th>
            <th>Credit hours</th>
            <th>Department</th>
            <th sec:authorize="hasRole('COORDINATOR')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.code}"></td>
            <td th:text="${course.title}"></td>
            <td th:text="${course.creditHours}"></td>
            <td th:text="${course.department != null ? course.department.name : '—'}"></td>
            <td sec:authorize="hasRole('COORDINATOR')">
                <form th:action="@{/courses/{id}/delete(id=${course.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Delete this course?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="link-button danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(courses)}">
            <td colspan="5">No courses yet.</td>
        </tr>
        </tbody>
    </table>

    <div sec:authorize="hasRole('COORDINATOR')" class="form-card">
        <h2>Add a course</h2>
        <form th:action="@{/courses}" method="post" class="form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="code">Code</label>
            <input type="text" id="code" name="code" required="required" placeholder="e.g. CS101"/>
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required="required" placeholder="e.g. Java Programming"/>
            <label for="creditHours">Credit hours</label>
            <input type="number" id="creditHours" name="creditHours" min="1" required="required"/>
            <label for="departmentId">Department</label>
            <select id="departmentId" name="departmentId" required="required">
                <option th:each="department : ${departments}" th:value="${department.id}"
                        th:text="${department.name}"></option>
            </select>
            <button type="submit">Add course</button>
        </form>
    </div>
</main>
</body>
</html>
