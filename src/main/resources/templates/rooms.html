<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Rooms — Course Timetable Planner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Rooms</h1>

    <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>
    <p th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></p>

    <table class="data-table">
        <thead>
        <tr>
            <th>Room number</th>
            <th>Building</th>
            <th>Capacity</th>
            <th sec:authorize="hasRole('COORDINATOR')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="room : ${rooms}">
            <td th:text="${room.roomNumber}"></td>
            <td th:text="${room.building}"></td>
            <td th:text="${room.capacity}"></td>
            <td sec:authorize="hasRole('COORDINATOR')">
                <form th:action="@{/rooms/{id}/delete(id=${room.id})}" method="post" style="display:inline"
                      onsubmit="return confirm('Delete this room?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="link-button danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(rooms)}">
            <td colspan="4">No rooms yet.</td>
        </tr>
        </tbody>
    </table>

    <div sec:authorize="hasRole('COORDINATOR')" class="form-card">
        <h2>Add a room</h2>
        <form th:action="@{/rooms}" method="post" class="form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="roomNumber">Room number</label>
            <input type="text" id="roomNumber" name="roomNumber" required="required" placeholder="e.g. 101"/>
            <label for="building">Building</label>
            <input type="text" id="building" name="building" placeholder="e.g. Main Building"/>
            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" name="capacity" min="1" required="required"/>
            <button type="submit">Add room</button>
        </form>
    </div>
</main>
</body>
</html>
