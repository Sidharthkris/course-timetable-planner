services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: timetable
      POSTGRES_PASSWORD: timetable
    ports:
      - "5432:5432"
    volumes:
      - timetable-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/timetable
      SPRING_DATASOURCE_USERNAME: timetable
      SPRING_DATASOURCE_PASSWORD: timetable
    ports:
      - "8080:8080"

volumes:
  timetable-db-data:
